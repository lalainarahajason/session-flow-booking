name: sfbk-sprint1
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sfbk_test
      MYSQL_USER: sfbk
      MYSQL_PASSWORD: sfbk_local_only
      MYSQL_ROOT_PASSWORD: sfbk_root_local_only
    volumes:
      - sfbk_mysql_test:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  sfbk_mysql_test:
